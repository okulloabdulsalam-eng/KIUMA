<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Dhikr Counter - KIUMA</title>
    <link rel="manifest" href="manifest.json">
    <script>
        (function() {
            var t;
            try { t = localStorage.getItem('themePreference'); } catch(e) {}
            if (t === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: var(--gray);
            padding-bottom: 0;
        }
        .container {
            max-width: 428px;
            margin: 0 auto;
            background: var(--white);
            min-height: 100vh;
        }
        .dhikr-header {
            background: linear-gradient(135deg, var(--primary-green), var(--dark-green));
            color: white;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .dhikr-header::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 20px;
            background: var(--white);
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
        }
        .dhikr-header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 1;
        }
        .dhikr-back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
        }
        .dhikr-title {
            font-size: 18px;
            font-weight: 600;
        }
        .dhikr-actions button {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        /* Dhikr Selector */
        .dhikr-selector {
            padding: 20px 15px;
        }
        .dhikr-tabs {
            display: flex;
            background: var(--gray);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
        }
        .dhikr-tab {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-gray);
            cursor: pointer;
            transition: all 0.3s;
        }
        .dhikr-tab.active {
            background: var(--primary-green);
            color: white;
        }

        /* Dhikr Cards */
        .dhikr-cards {
            display: grid;
            gap: 12px;
        }
        .dhikr-card {
            background: var(--white);
            border-radius: 12px;
            padding: 15px;
            box-shadow: var(--shadow);
            cursor: default;
            border-left: 4px solid var(--primary-green);
        }
        .dhikr-card-arabic {
            font-family: 'Amiri', serif;
            font-size: 22px;
            color: var(--dark-gray);
            margin-bottom: 8px;
            direction: rtl;
            text-align: right;
        }
        .dhikr-card-transliteration {
            font-size: 14px;
            color: var(--primary-green);
            font-weight: 500;
            margin-bottom: 4px;
        }
        .dhikr-card-meaning {
            font-size: 13px;
            color: var(--text-gray);
        }
        .dhikr-card-target {
            font-size: 12px;
            color: var(--primary-green);
            margin-top: 8px;
            font-weight: 500;
        }

        /* Counter Section */
        .counter-section {
            padding: 20px 15px 100px;
            text-align: center;
        }
        .current-dhikr {
            background: linear-gradient(135deg, var(--lighter-green), var(--white));
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .current-dhikr-arabic {
            font-family: 'Amiri', serif;
            font-size: 28px;
            color: var(--dark-green);
            margin-bottom: 10px;
            direction: rtl;
        }
        .current-dhikr-meaning {
            font-size: 14px;
            color: var(--text-gray);
        }

        /* Big Counter */
        .counter-display {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto 30px;
        }
        .counter-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-green), var(--dark-green));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 30px rgba(76, 175, 80, 0.3);
            cursor: pointer;
            transition: transform 0.1s;
            user-select: none;
        }
        .counter-circle:active {
            transform: scale(0.95);
        }
        .counter-number {
            font-size: 72px;
            font-weight: 700;
            color: white;
            line-height: 1;
        }
        .counter-label {
            font-size: 14px;
            color: rgba(255,255,255,0.8);
            margin-top: 5px;
        }
        .counter-progress {
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
        }
        .counter-progress svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }
        .counter-progress circle {
            fill: none;
            stroke-width: 4;
        }
        .counter-progress .bg {
            stroke: var(--lighter-green);
        }
        .counter-progress .fg {
            stroke: #FFD700;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s;
        }

        /* Counter Controls */
        .counter-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: var(--gray);
            color: var(--dark-gray);
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .control-btn:hover {
            background: var(--light-gray);
        }
        .control-btn.reset {
            background: #ffebee;
            color: #f44336;
        }

        /* Stats */
        .dhikr-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-item {
            background: var(--gray);
            border-radius: 12px;
            padding: 15px 10px;
        }
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-green);
        }
        .stat-label {
            font-size: 11px;
            color: var(--text-gray);
            margin-top: 4px;
        }

        /* Target Selector */
        .target-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .target-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid var(--light-gray);
            background: var(--white);
            color: var(--text-gray);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .target-btn.active {
            border-color: var(--primary-green);
            background: var(--lighter-green);
            color: var(--dark-green);
        }

        /* Vibration feedback indicator */
        .vibrate-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: rgba(76, 175, 80, 0.3);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s;
        }
        .vibrate-indicator.pulse {
            animation: ripple 0.4s ease-out;
        }
        @keyframes ripple {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
        }

        /* Completion celebration */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .celebration.show {
            opacity: 1;
            visibility: visible;
        }
        .celebration-content {
            text-align: center;
            color: white;
        }
        .celebration-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 0.5s ease infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
        .celebration h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .celebration p {
            font-size: 16px;
            opacity: 0.8;
        }
        .celebration-btn {
            margin-top: 25px;
            padding: 12px 30px;
            background: var(--primary-green);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }

        /* Supplication modal (read-only du'as) */
        .dua-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .dua-modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        .dua-modal {
            background: var(--white);
            border-radius: 16px;
            max-width: 400px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .dua-modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--light-gray);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .dua-modal-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--dark-gray);
        }
        .dua-modal-close {
            background: none;
            border: none;
            font-size: 22px;
            color: var(--text-gray);
            cursor: pointer;
        }
        .dua-modal-body {
            padding: 20px;
        }
        .dua-modal-arabic {
            font-family: 'Amiri', serif;
            font-size: 22px;
            line-height: 1.8;
            color: var(--dark-gray);
            direction: rtl;
            text-align: right;
            margin-bottom: 12px;
        }
        .dua-modal-transliteration {
            font-size: 14px;
            color: var(--primary-green);
            font-weight: 500;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        .dua-modal-meaning {
            font-size: 14px;
            color: var(--text-gray);
            line-height: 1.6;
            margin-bottom: 12px;
        }
        .dua-modal-source {
            font-size: 12px;
            color: var(--text-gray);
            opacity: 0.85;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-hero-compact">
            <div class="hero-deco"></div>
            <div class="hero-compact-nav">
                <button class="hero-back-btn" onclick="history.back()">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <div class="hero-compact-actions">
                    <button onclick="toggleSound()"><i class="fas fa-volume-up" id="soundIcon"></i></button>
                </div>
            </div>
            <div class="hero-compact-title">
                <h1>Dhikr</h1>
                <p>Remember Allah with daily adhkar</p>
                <div class="hero-accent-line"></div>
            </div>
        </div>

        <!-- Dhikr Selection -->
        <div class="dhikr-selector" id="dhikrSelector">
            <div class="dhikr-tabs">
                <button class="dhikr-tab active" data-tab="all" onclick="filterDhikr('all')">All</button>
                <button class="dhikr-tab" data-tab="morning" onclick="filterDhikr('morning')">Morning</button>
                <button class="dhikr-tab" data-tab="evening" onclick="filterDhikr('evening')">Evening</button>
                <button class="dhikr-tab" data-tab="supplication" onclick="filterDhikr('supplication')">Supplications</button>
            </div>
            <div class="dhikr-cards" id="dhikrCards"></div>
        </div>

        <!-- Counter Section (hidden initially) -->
        <div class="counter-section" id="counterSection" style="display:none;">
            <div class="current-dhikr">
                <div class="current-dhikr-arabic" id="currentArabic"></div>
                <div class="current-dhikr-meaning" id="currentMeaning"></div>
            </div>

            <div class="counter-display">
                <div class="counter-progress">
                    <svg viewBox="0 0 230 230">
                        <circle class="bg" cx="115" cy="115" r="108"></circle>
                        <circle class="fg" id="progressCircle" cx="115" cy="115" r="108" 
                            stroke-dasharray="679" stroke-dashoffset="679"></circle>
                    </svg>
                </div>
                <div class="counter-circle" id="counterCircle" onclick="incrementCounter()">
                    <span class="counter-number" id="counterNumber">0</span>
                    <span class="counter-label">Tap to count</span>
                </div>
            </div>

            <div class="counter-controls">
                <button class="control-btn" onclick="decrementCounter()">
                    <i class="fas fa-minus"></i>
                </button>
                <button class="control-btn reset" onclick="resetCounter()">
                    <i class="fas fa-redo"></i>
                </button>
                <button class="control-btn" onclick="showDhikrSelector()">
                    <i class="fas fa-list"></i>
                </button>
            </div>

            <div class="dhikr-stats">
                <div class="stat-item">
                    <div class="stat-value" id="todayCount">0</div>
                    <div class="stat-label">Today</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">Total</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="targetProgress">0%</div>
                    <div class="stat-label">Progress</div>
                </div>
            </div>

            <div class="target-selector">
                <button class="target-btn" onclick="setTarget(33)">33</button>
                <button class="target-btn active" onclick="setTarget(100)">100</button>
                <button class="target-btn" onclick="setTarget(500)">500</button>
                <button class="target-btn" onclick="setTarget(1000)">1000</button>
            </div>
        </div>

        <div class="vibrate-indicator" id="vibrateIndicator"></div>
    </div>

    <!-- Celebration Modal -->
    <div class="celebration" id="celebration">
        <div class="celebration-content">
            <div class="celebration-icon">🎉</div>
            <h2>MashaAllah!</h2>
            <p>You completed <span id="celebrationTarget">100</span> dhikr!</p>
            <button class="celebration-btn" onclick="closeCelebration()">Continue</button>
        </div>
    </div>

    <!-- Supplication (Du'a) Modal -->
    <div class="dua-modal-overlay" id="duaModal" onclick="if(event.target===this)closeDuaModal()">
        <div class="dua-modal">
            <div class="dua-modal-header">
                <span class="dua-modal-title" id="duaModalTitle">Supplication</span>
                <button class="dua-modal-close" onclick="closeDuaModal()">&times;</button>
            </div>
            <div class="dua-modal-body">
                <div class="dua-modal-arabic" id="duaModalArabic"></div>
                <div class="dua-modal-transliteration" id="duaModalTransliteration"></div>
                <div class="dua-modal-meaning" id="duaModalMeaning"></div>
                <div class="dua-modal-source" id="duaModalSource"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        const DHIKR_STORAGE_KEY = 'dhikr_data';

        // Morning & Evening Adhkar — from Sahih Bukhari, Muslim, Abu Dawud, Tirmidhi
        const dhikrList = [
            { id: 1, arabic: 'سُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ وَاللَّهُ أَكْبَرُ', transliteration: 'SubhanAllah, Alhamdulillah, Allahu Akbar', meaning: 'Glory be to Allah, praise be to Allah, Allah is the Greatest. (33 times each after Fajr & Maghrib)', category: 'morning', defaultTarget: 33 },
            { id: 2, arabic: 'لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ', transliteration: 'La ilaha illallah wahdahu la sharika lah, lahul mulku wa lahul hamdu wa huwa ala kulli shayin qadir', meaning: 'None has the right to be worshipped but Allah alone, with no partner. His is the dominion and His is the praise, and He is able to do all things. (10x morning & evening)', category: 'morning', defaultTarget: 10 },
            { id: 3, arabic: 'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ', transliteration: 'SubhanAllahi wa bihamdihi', meaning: 'Glory and praise be to Allah. (Whoever says it 100 times, his sins are forgiven.)', category: 'morning', defaultTarget: 100 },
            { id: 4, arabic: 'لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ', transliteration: 'La hawla wa la quwwata illa billah', meaning: 'There is no power and no strength except with Allah. (Treasure from the treasures of Paradise.)', category: 'morning', defaultTarget: 100 },
            { id: 5, arabic: 'أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ', transliteration: 'Astaghfirullah wa atubu ilayh', meaning: 'I seek forgiveness from Allah and repent to Him. (100 times daily)', category: 'morning', defaultTarget: 100 },
            { id: 6, arabic: 'اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَىٰ نَبِيِّنَا مُحَمَّدٍ', transliteration: 'Allahumma salli wa sallim ala nabiyyina Muhammad', meaning: 'O Allah, send blessings and peace upon our Prophet Muhammad.', category: 'morning', defaultTarget: 10 },
            { id: 7, arabic: 'اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ', transliteration: 'Ayat al-Kursi (full verse)', meaning: 'Recite Ayat al-Kursi (2:255) after every obligatory prayer; nothing prevents him from entering Paradise except death.', category: 'morning', defaultTarget: 1 },
            { id: 8, arabic: 'آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ...', transliteration: 'Last two verses of Surah Al-Baqarah', meaning: 'Recite the last two verses of Surah Al-Baqarah at night; they will suffice him.', category: 'evening', defaultTarget: 1 },
            { id: 9, arabic: 'قُلْ هُوَ اللَّهُ أَحَدٌ... قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ... قُلْ أَعُوذُ بِرَبِّ النَّاسِ', transliteration: 'Surah Ikhlas, Falaq, Nas (3 times each)', meaning: 'Recite Surah Ikhlas, Falaq and Nas three times at morning and evening; they will suffice you against everything.', category: 'morning', defaultTarget: 3 },
            { id: 10, arabic: 'سُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ وَلَا إِلَٰهَ إِلَّا اللَّهُ وَاللَّهُ أَكْبَرُ', transliteration: 'SubhanAllah, Alhamdulillah, La ilaha illallah, Allahu Akbar', meaning: 'The four remembrances. (Best words after the Qur’an.)', category: 'evening', defaultTarget: 100 },
            { id: 11, arabic: 'اللَّهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ', transliteration: 'Allahumma bika asbahna wa bika amsayna wa bika nahya wa bika namutu wa ilaykan nushur', meaning: 'O Allah, by You we reach the morning and by You we reach the evening, by You we live and by You we die, and to You is the resurrection. (Morning & evening)', category: 'morning', defaultTarget: 1 },
            { id: 12, arabic: 'اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَٰهَ إِلَّا أَنْتَ', transliteration: 'Allahumma afini fi badani, afini fi sami, afini fi basari, la ilaha illa anta', meaning: 'O Allah, grant me health in my body, in my hearing and in my sight; there is no god but You. (3x morning & evening)', category: 'morning', defaultTarget: 3 },
            { id: 13, arabic: 'حَسْبِيَ اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ', transliteration: 'Hasbiyallah la ilaha illa huwa alayhi tawakkaltu wa huwa rabbul arshil azim', meaning: 'Allah is sufficient for me. There is no god but He. In Him I put my trust and He is the Lord of the Mighty Throne. (7x morning & evening)', category: 'evening', defaultTarget: 7 }
        ];

        // Important supplications from authentic hadith (read-only; no counter)
        const supplicationList = [
            { title: 'For the dead (Janazah)', arabic: 'اللَّهُمَّ اغْفِرْ لَهُ وَارْحَمْهُ وَعَافِهِ وَاعْفُ عَنْهُ وَأَكْرِمْ نُزُلَهُ وَوَسِّعْ مُدْخَلَهُ وَاغْسِلْهُ بِالْمَاءِ وَالثَّلْجِ وَالْبَرَدِ وَنَقِّهِ مِنَ الْخَطَايَا كَمَا نَقَّيْتَ الثَّوْبَ الأَبْيَضَ مِنَ الدَّنَسِ وَأَبْدِلْهُ دَاراً خَيْراً مِنْ دَارِهِ وَأَهْلاً خَيْراً مِنْ أَهْلِهِ وَزَوْجاً خَيْراً مِنْ زَوْجِهِ وَأَدْخِلْهُ الْجَنَّةَ وَأَعِذْهُ مِنْ عَذَابِ الْقَبْرِ وَعَذَابِ النَّارِ', transliteration: 'Allahumma ghfir lahu warhamhu wa afihi wa fu anhu wa akrim nuzulahu wa wassi mudkhalahu waghsilhu bilmai waththalji walbardi wa naqqihi minal khataaya kama naqqaytath thawbal abyadha minad danasi wa abdilhu daran khayran min darihi wa ahlan khayran min ahlihi wa zawjan khayran min zawjihi wa adkhilhul jannata wa aidhhu min adhabil qabri wa adhabin nar', meaning: 'O Allah, forgive him and have mercy on him, keep him safe and sound and forgive him. Honour the place where he settles and make his entrance wide; wash him with water and snow and hail, and cleanse him of sin as You cleanse a white garment of impurity. Give him a home better than his home, and a family better than his family, and a spouse better than his spouse. Admit him to Paradise and protect him from the torment of the grave and the torment of the Fire.', source: 'Muslim 963' },
            { title: 'When visiting the grave', arabic: 'السَّلَامُ عَلَيْكُمْ أَهْلَ الدِّيَارِ مِنَ الْمُؤْمِنِينَ وَالْمُسْلِمِينَ وَإِنَّا إِنْ شَاءَ اللَّهُ بِكُمْ لَاحِقُونَ نَسْأَلُ اللَّهَ لَنَا وَلَكُمُ الْعَافِيَةَ', transliteration: 'As-salamu alaykum ahlad diyari minal muminina wal muslimin wa inna in sha Allahu bikum lahiqun nasalullah lana wa lakumul afiyah', meaning: 'Peace be upon you, O inhabitants of the abodes, believers and Muslims. Indeed we will, if Allah wills, join you. We ask Allah for well-being for us and for you.', source: 'Muslim 974' },
            { title: 'Before eating', arabic: 'بِسْمِ اللَّهِ', transliteration: 'Bismillah', meaning: 'In the name of Allah. (If he forgets at the start, say: Bismillahi fi awwalihi wa akhirih.)', source: 'Abu Dawud 3767, Tirmidhi 1858' },
            { title: 'After eating', arabic: 'الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ', transliteration: 'Alhamdulillahi alladhi atamani hadha wa razaqanihi min ghayri hawlin minni wa la quwwah', meaning: 'Praise be to Allah who has fed me this and provided it for me without any might or power from myself.', source: 'Abu Dawud 3853, Tirmidhi 3458' },
            { title: 'When travelling', arabic: 'سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ اللَّهُمَّ إِنَّا نَسْأَلُكَ فِي سَفَرِنَا هَذَا الْبِرَّ وَالتَّقْوَى وَمِنَ الْعَمَلِ مَا تَرْضَى اللَّهُمَّ هَوِّنْ عَلَيْنَا سَفَرَنَا هَذَا وَاطْوِ عَنَّا بُعْدَهُ اللَّهُمَّ أَنْتَ الصَّاحِبُ فِي السَّفَرِ وَالْخَلِيفَةُ فِي الأَهْلِ', transliteration: 'Subhanalladhi sakhkhara lana hadha wa ma kunna lahu muqrinin wa inna ila rabbina lamunqalibun. Allahumma inna nasaluka fi safarina hadhal birra wattaqwa wa minal amali ma tardha. Allahumma hawwin alayna safarana hadha watwi anna buudah. Allahumma antas sahibu fis safari wal khalifatu fil ahli', meaning: 'Glory to Him who has made this subservient to us though we could not have done it ourselves. Truly to our Lord we are returning. O Allah, we ask You for righteousness and piety in this journey of ours, and for deeds that please You. O Allah, make this journey easy for us and shorten its distance. O Allah, You are the Companion on the journey and the One in charge of the family.', source: 'Muslim 1342' },
            { title: 'Entering the home', arabic: 'بِسْمِ اللَّهِ وَلَجْنَا وَبِسْمِ اللَّهِ خَرَجْنَا وَعَلَى رَبِّنَا تَوَكَّلْنَا', transliteration: 'Bismillahi walajna wa bismillahi kharajna wa ala rabbina tawakkaltu', meaning: 'In the name of Allah we enter and in the name of Allah we leave, and upon our Lord we rely.', source: 'Abu Dawud 5096' },
            { title: 'Leaving the home', arabic: 'بِسْمِ اللَّهِ تَوَكَّلْتُ عَلَى اللَّهِ لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ', transliteration: 'Bismillahi tawakkaltu alallah la hawla wa la quwwata illa billah', meaning: 'In the name of Allah, I place my trust in Allah. There is no power and no strength except with Allah.', source: 'Abu Dawud 5095, Tirmidhi 3426' },
            { title: 'When waking up', arabic: 'الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ', transliteration: 'Alhamdulillahi alladhi ahyana bada ma amatana wa ilayhin nushur', meaning: 'Praise be to Allah who gave us life after having taken it from us, and to Him is the resurrection.', source: 'Bukhari 6312' },
            { title: 'Before sleeping', arabic: 'اللَّهُمَّ بِاسْمِكَ أَمُوتُ وَأَحْيَا', transliteration: 'Allahumma bismika amutu wa ahya', meaning: 'O Allah, in Your name I die and I live.', source: 'Bukhari 6312' },
            { title: 'When in distress or grief', arabic: 'لَا إِلَٰهَ إِلَّا اللَّهُ الْعَظِيمُ الْحَلِيمُ لَا إِلَٰهَ إِلَّا اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ لَا إِلَٰهَ إِلَّا اللَّهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيمِ', transliteration: 'La ilaha illallahul azimul halim. La ilaha illallah rabbul arshil azim. La ilaha illallah rabbus samawati wa rabbul ardhi wa rabbul arshil karim', meaning: 'There is no god but Allah, the Mighty, the Forbearing. There is no god but Allah, Lord of the Mighty Throne. There is no god but Allah, Lord of the heavens and Lord of the earth and Lord of the noble Throne.', source: 'Bukhari 6345' },
            { title: 'Seeking protection from evil', arabic: 'أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ', transliteration: 'Audhu bi kalimatillahit tammati min sharri ma khalaq', meaning: 'I seek refuge in the perfect words of Allah from the evil of what He has created.', source: 'Muslim 2708' },
            { title: 'Entering the mosque', arabic: 'اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ', transliteration: 'Allahummaftah li abwaba rahmatik', meaning: 'O Allah, open for me the gates of Your mercy.', source: 'Muslim 713' },
            { title: 'Leaving the mosque', arabic: 'اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ', transliteration: 'Allahumma inni asaluka min fadlik', meaning: 'O Allah, I ask You of Your bounty.', source: 'Muslim 713' }
        ];

        let currentDhikr = null;
        let count = 0;
        let target = 100;
        let soundEnabled = true;
        let data = { today: {}, total: {}, lastDate: '' };

        // Load saved data
        function loadData() {
            try {
                const saved = localStorage.getItem(DHIKR_STORAGE_KEY);
                if (saved) {
                    data = JSON.parse(saved);
                    // Reset today if date changed
                    const today = new Date().toDateString();
                    if (data.lastDate !== today) {
                        data.today = {};
                        data.lastDate = today;
                        saveData();
                    }
                }
            } catch(e) {}
        }

        function saveData() {
            localStorage.setItem(DHIKR_STORAGE_KEY, JSON.stringify(data));
        }

        function renderDhikrCards(filter = 'all') {
            const container = document.getElementById('dhikrCards');
            if (filter === 'supplication') {
                container.innerHTML = supplicationList.map((dua, i) => `
                    <div class="dhikr-card" onclick="openDuaModal(${i})" style="cursor:pointer;">
                        <div class="dhikr-card-transliteration" style="margin-bottom:6px;">${dua.title}</div>
                        <div class="dhikr-card-arabic" style="font-size:18px;">${dua.arabic}</div>
                        <div class="dhikr-card-meaning" style="margin-top:6px;">${dua.source}</div>
                    </div>
                `).join('');
                return;
            }
            const filtered = filter === 'all' ? dhikrList : dhikrList.filter(d => d.category === filter);
            container.innerHTML = filtered.map(dhikr => `
                <div class="dhikr-card" onclick="selectDhikr(${dhikr.id})" style="cursor:pointer;">
                    <div class="dhikr-card-arabic">${dhikr.arabic}</div>
                    <div class="dhikr-card-transliteration">${dhikr.transliteration}</div>
                    <div class="dhikr-card-meaning">${dhikr.meaning}</div>
                    <div class="dhikr-card-target">Target: ${dhikr.defaultTarget}</div>
                </div>
            `).join('');
        }

        function filterDhikr(category) {
            document.querySelectorAll('.dhikr-tab').forEach(tab => {
                const tabCategory = (tab.getAttribute('data-tab') || tab.textContent.trim().toLowerCase());
                tab.classList.toggle('active', tabCategory === category);
            });
            renderDhikrCards(category);
        }

        function openDuaModal(index) {
            const dua = supplicationList[index];
            if (!dua) return;
            document.getElementById('duaModalTitle').textContent = dua.title;
            document.getElementById('duaModalArabic').textContent = dua.arabic;
            document.getElementById('duaModalTransliteration').textContent = dua.transliteration;
            document.getElementById('duaModalMeaning').textContent = dua.meaning;
            document.getElementById('duaModalSource').textContent = 'Source: ' + (dua.source || 'Authentic hadith');
            document.getElementById('duaModal').classList.add('show');
        }

        function closeDuaModal() {
            document.getElementById('duaModal').classList.remove('show');
        }
        window.closeDuaModal = closeDuaModal;

        function selectDhikr(id) {
            currentDhikr = dhikrList.find(d => d.id === id);
            target = currentDhikr.defaultTarget;
            count = data.today[id] || 0;
            
            document.getElementById('currentArabic').textContent = currentDhikr.arabic;
            document.getElementById('currentMeaning').textContent = currentDhikr.meaning;
            
            document.getElementById('dhikrSelector').style.display = 'none';
            document.getElementById('counterSection').style.display = 'block';
            
            updateDisplay();
            updateTargetButtons();
        }

        function showDhikrSelector() {
            document.getElementById('dhikrSelector').style.display = 'block';
            document.getElementById('counterSection').style.display = 'none';
            renderDhikrCards();
        }

        function incrementCounter() {
            count++;
            data.today[currentDhikr.id] = count;
            data.total[currentDhikr.id] = (data.total[currentDhikr.id] || 0) + 1;
            saveData();
            
            updateDisplay();
            triggerFeedback();
            
            // Check if target reached
            if (count === target) {
                celebrate();
            }
        }

        function decrementCounter() {
            if (count > 0) {
                count--;
                data.today[currentDhikr.id] = count;
                data.total[currentDhikr.id] = Math.max(0, (data.total[currentDhikr.id] || 0) - 1);
                saveData();
                updateDisplay();
            }
        }

        function resetCounter() {
            count = 0;
            data.today[currentDhikr.id] = 0;
            saveData();
            updateDisplay();
        }

        function setTarget(newTarget) {
            target = newTarget;
            updateDisplay();
            updateTargetButtons();
        }

        function updateTargetButtons() {
            document.querySelectorAll('.target-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.textContent) === target);
            });
        }

        function updateDisplay() {
            document.getElementById('counterNumber').textContent = count;
            document.getElementById('todayCount').textContent = count;
            document.getElementById('totalCount').textContent = data.total[currentDhikr.id] || 0;
            
            const progress = Math.min(100, Math.round((count / target) * 100));
            document.getElementById('targetProgress').textContent = progress + '%';
            
            // Update progress circle
            const circumference = 2 * Math.PI * 108;
            const offset = circumference - (progress / 100) * circumference;
            document.getElementById('progressCircle').style.strokeDashoffset = offset;
        }

        function triggerFeedback() {
            // Vibration
            if (navigator.vibrate) {
                navigator.vibrate(30);
            }
            
            // Visual feedback
            const indicator = document.getElementById('vibrateIndicator');
            indicator.classList.remove('pulse');
            void indicator.offsetWidth; // Trigger reflow
            indicator.classList.add('pulse');
            
            // Sound (optional)
            if (soundEnabled) {
                // Could add click sound here
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundIcon').className = soundEnabled ? 'fas fa-volume-up' : 'fas fa-volume-mute';
        }

        function celebrate() {
            document.getElementById('celebrationTarget').textContent = target;
            document.getElementById('celebration').classList.add('show');
            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100, 50, 100]);
            }
        }

        function closeCelebration() {
            document.getElementById('celebration').classList.remove('show');
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            renderDhikrCards();
        });
    </script>
</body>
</html>
